  <script>
    (function () {
      try {
        var m = location.search.match(/[?&]lang=(gu|hi|en)\b/);
        var l = m ? m[1] : 'en';
        try {
          if (m) localStorage.setItem('pt-lang', l);
          else { var s = localStorage.getItem('pt-lang'); if (s === 'gu' || s === 'hi') l = s; }
        } catch (e) { /* private mode: ?lang= only */ }
        document.documentElement.lang = l;
        var dict = {
          gu: {
            title: 'મોબાઇલ એપ ડેવલપમેન્ટ | Peacock Technotrics',
            desc: 'ગ્રાહકો અને ફિલ્ડ ટીમો માટે iOS, Android અને ક્રોસ-પ્લેટફોર્મ મોબાઇલ એપ્સ — ડિઝાઇનથી App Store અને Google Play સુધી.'
          },
          hi: {
            title: 'मोबाइल ऐप डेवलपमेंट | Peacock Technotrics',
            desc: 'ग्राहकों और फ़ील्ड टीमों के लिए iOS, Android और क्रॉस-प्लेटफ़ॉर्म मोबाइल ऐप्स — डिज़ाइन से App Store और Google Play तक।'
          }
        };
        var d = dict[l];
        if (d) {
          document.title = d.title;
          var md = document.querySelector('meta[name="description"]');
          if (md) md.setAttribute('content', d.desc);
        }
      } catch (e) { /* keep English defaults */ }
    })();
  </script>
